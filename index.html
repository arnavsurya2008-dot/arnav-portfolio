    // --- PROCEDURAL 8-BIT AUDIO SYNTHESIZER (WEB AUDIO API) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playBip(freq = 440, type = 'square', duration = 0.08) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playSelect() {
        this.playBip(587.33, 'square', 0.05); // D5
        setTimeout(() => this.playBip(880, 'square', 0.08), 50); // A5
      }
      playRoll() {
        if (!this.enabled) return;
        this.init();
        const tones = [300, 420, 520, 650, 800, 950];
        tones.forEach((t, i) => {
          setTimeout(() => this.playBip(t, 'triangle', 0.05), i * 45);
        });
      }
      playLevelUp() {
        if (!this.enabled) return;
        this.init();
        const fanfare = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        fanfare.forEach((f, i) => {
          setTimeout(() => this.playBip(f, 'square', 0.12), i * 90);
        });
      }
      playHeal() {
        if (!this.enabled) return;
        this.init();
        [440, 554.37, 659.25].forEach((f, i) => {
          setTimeout(() => this.playBip(f, 'sine', 0.1), i * 60);
        });
      }

                              <h4 className="font-tech text-base font-bold text-slate-100">
                                {quest.title}
                              </h4>
                            </div>
                          </div>
                          <span className={`font-pixel text-[9px] px-2.5 py-1 rounded border ${
                            quest.highlight 
                              ? 'bg-amber-500/20 border-amber-400 text-amber-300' 
                              : 'bg-slate-800 border-slate-700 text-slate-300'
                          }`}>
                            {quest.badge}
                          </span>
                        </div>

                        <p className="font-tech text-xs md:text-sm text-slate-300 mt-2.5 leading-relaxed">
                          {quest.description}
                        </p>

                        <div className="mt-3 flex flex-wrap gap-2 pt-2 border-t border-slate-800/80 font-mono text-[11px]">
                          <span className="text-slate-400">Loot & Rewards:</span>
                          {quest.rewards.map((rew, rIdx) => (
                            <span key={rIdx} className="bg-slate-950 text-cyan-300 border border-cyan-500/30 px-2 py-0.5 rounded-xs">
                              {rew}
                            </span>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* CELL 5: CHRONICLES & GUILDS (EDUCATION) */}
              {(activeTab === 'ALL' || activeTab === 'LORE') && (
                <div className="rpg-cell p-5 rounded-sm">
                  <div className="flex justify-between items-center border-b border-cyan-500/30 pb-3">
                    <div className="flex items-center space-x-2">
                      <Icons.Book />
                      <h3 className="font-pixel text-xs text-cyan-300">
                        CELL 05 // GUILD CHRONICLES & ACADEMIC LORE
                      </h3>
                    </div>
                    <span className="font-mono text-xs text-cyan-400">
                      EDUCATION ARCHIVES
                    </span>
                  </div>

                  <div className="relative border-l-2 border-cyan-500/30 ml-4 mt-6 space-y-6 pl-6 pb-2">
                    {chronicles.map((entry, eIdx) => (
                      <div key={eIdx} className="relative group">
                        {/* Node marker */}
                        <div className="absolute -left-[31px] top-1 w-3.5 h-3.5 bg-cyan-400 border-2 border-[#060913] rounded-full group-hover:scale-125 transition-transform shadow-[0_0_8px_rgba(0,240,255,0.8)]"></div>

                        <div className="bg-slate-900/70 border border-slate-800 group-hover:border-cyan-500/40 p-3.5 rounded transition">
                          <div className="flex flex-wrap items-center justify-between gap-1">
                            <span className="font-mono text-[10px] text-cyan-400 font-bold">
                              {entry.period}
                            </span>
                            <span className="text-[10px] font-mono text-slate-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                              {entry.type}
                            </span>
                          </div>

                          <h4 className="font-tech text-base font-bold text-slate-100 mt-1">
                            {entry.title}
                          </h4>
                          <p className="font-mono text-xs text-amber-400">
                            {entry.institution}
                          </p>
                          <p className="font-tech text-xs text-slate-300 mt-2 leading-relaxed">
                            {entry.lore}
                          </p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* CELL 6: INVENTORY & LOADOUT ARTIFACTS */}
              {(activeTab === 'ALL' || activeTab === 'ITEMS') && (
                <div className="rpg-cell p-5 rounded-sm">
                  <div className="flex justify-between items-center border-b border-cyan-500/30 pb-3">
                    <div className="flex items-center space-x-2">
                      <Icons.Sword />
                      <h3 className="font-pixel text-xs text-cyan-300">
                        CELL 06 // EQUIPPED ARTIFACTS & LOADOUT
                      </h3>
                    </div>
                    <span className="font-mono text-xs text-purple-400">
                      GEAR VAULT
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-4">
                    {inventory.map((item, idx) => (
                      <div 
                        key={idx}
                        className="p-3 bg-slate-900/80 border border-slate-800 hover:border-purple-500/40 transition rounded flex flex-col justify-between"
                      >
                        <div>
                          <div className="flex items-center space-x-2">
                            <span className="text-xl p-1.5 bg-slate-950 rounded border border-slate-800">
                              {item.icon}
                            </span>
                            <div>
                              <h5 className="font-tech font-bold text-xs text-slate-200">
                                {item.name}
                              </h5>
                              <span className="font-mono text-[9px] text-purple-400">
                                {item.slot}
                              </span>
                            </div>
                          </div>
                          <p className="font-mono text-[11px] text-slate-400 mt-2">
                            {item.stat}
                          </p>
                        </div>
                        <div className="mt-2 pt-2 border-t border-slate-800/80 flex justify-between items-center text-[9px] font-pixel">
                          <span className={
                            item.rarity === 'Legendary' ? 'text-amber-400' :
                            item.rarity === 'Epic' ? 'text-purple-400' :
                            item.rarity === 'Rare' ? 'text-blue-400' : 'text-slate-400'
                          }>
                            {item.rarity}
                          </span>
                          <span className="text-emerald-400">EQUIPPED</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* CELL 7: COMMS / SOCIAL EXPANDED */}
              {(activeTab === 'COMMS') && (
                <div className="rpg-cell p-5 rounded-sm">
                  <div className="flex justify-between items-center border-b border-cyan-500/30 pb-3">
                    <div className="flex items-center space-x-2">
                      <Icons.Terminal />
                      <h3 className="font-pixel text-xs text-cyan-300">
                        CELL 07 // DIRECT COMMS & NETWORK CHANNELS
                      </h3>
                    </div>
                    <span className="font-mono text-xs text-cyan-400">SIGNAL ACTIVE</span>
                  </div>

                  <div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4 font-mono text-xs">
                    <div className="p-4 bg-slate-900/80 border border-blue-500/30 rounded">
                      <h4 className="font-pixel text-xs text-blue-300 mb-2">LINKEDIN UPLINK</h4>
                      <p className="text-slate-300 font-tech text-sm mb-3">
                        Connect for internships, collaborative hackathon squads, or open source security projects.
                      </p>
                      <a 
                        href="https://www.linkedin.com/in/arnav-suryavanshi" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-2 px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-xs transition"
                      >
                        <span>Open Arnav's LinkedIn</span>
                        <Icons.ExternalLink />
                      </a>
                    </div>

                    <div className="p-4 bg-slate-900/80 border border-pink-500/30 rounded">
                      <h4 className="font-pixel text-xs text-pink-300 mb-2">INSTAGRAM FREQUENCY</h4>
                      <p className="text-slate-300 font-tech text-sm mb-3">
                        Follow the journey, student tech milestones, and creative experiments on Instagram.
                      </p>
                      <a 
                        href="https://www.instagram.com/arnavsuryavanshi_18" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-2 px-3 py-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white rounded text-xs transition"
                      >
                        <span>Follow @arnavsuryavanshi_18</span>
                        <Icons.ExternalLink />
                      </a>
                    </div>
                  </div>
                </div>
              )}

            </section>
          </main>

          {/* Bottom HUD Status Strip */}
          <footer className="max-w-7xl mx-auto px-4 mt-8 pt-4 border-t border-slate-800/80 flex flex-wrap items-center justify-between text-xs font-mono text-slate-500 gap-3">
            <div className="flex items-center space-x-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span>HOST: ARNAV_PORTFOLIO_OS // REACT_CELL_V2.0</span>
            </div>
            <div className="text-center">
              <span>DESIGNED FOR ARNAV SURYAVANSHI • BCA STUDENT • 2026</span>
            </div>
            <div className="flex items-center space-x-3">
              <button 
                onClick={() => {
                  window.print();
                }}
                className="hover:text-cyan-400 underline"
              >
                [EXPORT / PRINT SHEET]
              </button>
            </div>
          </footer>
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
